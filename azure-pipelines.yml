trigger: none

pool: mera-agent-pool

steps:

- task: SonarQubePrepare@8
  inputs:
    SonarQube: 'Todo-ADO-service'
    scannerMode: 'cli'
    configMode: 'manual'
    cliProjectKey: 'Todo-ADO'
    cliProjectName: 'Todo-ADO'
    cliSources: '.'

- task: SonarQubeAnalyze@8
  inputs:
    jdkversion: 'JAVA_HOME_17_X64'

- task: SonarQubePublish@8
  inputs:
    pollingTimeoutSec: '300'



